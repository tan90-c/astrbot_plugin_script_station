<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脚本挂机面板</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1f2329; --muted: #8a919f;
    --border: #e3e6eb; --primary: #3370ff; --primary-h: #245bdb;
    --green: #34a853; --red: #e5484d; --amber: #f5a623;
    --console-bg: #0f1419; --console-text: #d5dae0;
    --radius: 10px;
  }
  [data-theme="dark"] {
    --bg: #17191f; --panel: #1f232b; --text: #e6e8eb; --muted: #9aa1ad;
    --border: #2e3440; --primary: #4f8cff; --primary-h: #6b9eff;
    --console-bg: #101216; --console-text: #cfd6dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191f; --panel: #1f232b; --text: #e6e8eb; --muted: #9aa1ad;
      --border: #2e3440; --primary: #4f8cff; --primary-h: #6b9eff;
      --console-bg: #101216; --console-text: #cfd6dd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 14px; }
  h1 small { color: var(--muted); font-size: 12px; font-weight: normal; margin-left: 8px; }

  /* 标签页 */
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); color: var(--text); cursor: pointer; user-select: none;
    font-size: 13px; transition: all .15s;
  }
  .tab:hover { border-color: var(--primary); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .tab .dot.running { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .tab .dot.stopping { background: var(--amber); }
  .tab .dot.exited { background: var(--red); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 180px; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; cursor: pointer; }

  input[type="text"], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--primary); }
  textarea.code {
    font: 13px/1.55 Consolas, "Courier New", monospace;
    min-height: 300px; resize: vertical; white-space: pre; tab-size: 4;
  }

  button {
    padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  button:hover { border-color: var(--primary); color: var(--primary); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-h); color: #fff; }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button.run { background: var(--green); border-color: var(--green); color: #fff; }
  button.run:hover { filter: brightness(1.08); color: #fff; }
  button.stop { background: var(--red); border-color: var(--red); color: #fff; }
  button.stop:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
  .pill.running { color: var(--green); border-color: var(--green); }
  .pill.stopping { color: var(--amber); border-color: var(--amber); }
  .pill.exited  { color: var(--red); border-color: var(--red); }

  /* 脚本库表格 */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: normal; }
  td .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  td .ops button { padding: 3px 10px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }

  /* 控制台 */
  #console {
    background: var(--console-bg); color: var(--console-text);
    font: 12.5px/1.6 Consolas, "Courier New", monospace;
    border-radius: 8px; padding: 12px; height: 380px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  #console .line { display: block; }
  #console .ts { color: #5c6a7a; margin-right: 8px; }
  #console .sys { color: #6ea8ff; }
  .con-bar { display: flex; gap: 10px; align-items: center; margin: 10px 0 8px; flex-wrap: wrap; }
  .con-bar .meta { color: var(--muted); font-size: 12px; margin-right: auto; }

  .hidden { display: none !important; }

  /* 模态框（iframe 内禁用 confirm） */
  #modalMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: min(400px, 86vw); box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  #modalMsg { margin-bottom: 16px; }
  #modal .row { justify-content: flex-end; }

  /* Toast */
  #toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 18px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.15);
    display: none; z-index: 60; max-width: 80vw;
  }
  #toast.err { border-color: var(--red); color: var(--red); }
  #toast.ok { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>
<div id="app">
  <h1>脚本挂机面板 <small>v1.0.0 · 常驻脚本 / 实时控制台</small></h1>
  <div id="tabs"></div>

  <!-- 首页 -->
  <div id="view-home">
    <div class="card">
      <h2>➕ 添加脚本</h2>
      <div class="row" style="margin-bottom:10px">
        <input type="text" id="newName" class="grow" placeholder="脚本名称，如：点赞统计服务" maxlength="64">
        <label class="chk"><input type="checkbox" id="newAuto">加载时自动启动</label>
      </div>
      <textarea id="newCode" class="code" style="min-height:200px" placeholder="# 粘贴 Python 代码，支持 app.run(host=..., port=...) 常驻脚本&#10;from flask import Flask&#10;app = Flask(__name__)&#10;&#10;@app.route('/')&#10;def index():&#10;    return 'hello from station'&#10;&#10;if __name__ == '__main__':&#10;    app.run(host='0.0.0.0', port=8080)"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnAdd">添加并打开标签页</button>
      </div>
    </div>
    <div class="card">
      <h2>📚 脚本库</h2>
      <table>
        <thead><tr><th>名称</th><th style="width:110px">状态</th><th style="width:120px">自动启动</th><th style="width:250px">操作</th></tr></thead>
        <tbody id="libBody"></tbody>
      </table>
      <div id="libEmpty" class="empty hidden">还没有脚本，在上方添加第一个吧</div>
    </div>
  </div>

  <!-- 脚本详情 -->
  <div id="view-script" class="hidden">
    <div class="card">
      <div class="row">
        <input type="text" id="scName" class="grow" maxlength="64" placeholder="脚本名称">
        <label class="chk"><input type="checkbox" id="scAuto">加载时自动启动</label>
        <span class="pill" id="scState">已停止</span>
      </div>
      <textarea id="scCode" class="code" style="margin-top:10px" spellcheck="false"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnSave">💾 保存</button>
        <button class="run" id="btnRun">▶ 启动</button>
        <button class="stop" id="btnStop">■ 停止</button>
        <button class="danger" id="btnDel">🗑 删除脚本</button>
        <span style="margin-left:auto;color:var(--muted);font-size:12px" id="scHint"></span>
      </div>
    </div>
    <div class="card">
      <h2>🖥 控制台输出</h2>
      <div class="con-bar">
        <span class="meta" id="conMeta">--</span>
        <label class="chk"><input type="checkbox" id="conFollow" checked>自动滚动</label>
        <button id="btnClearLog">清屏</button>
      </div>
      <div id="console"></div>
    </div>
  </div>
</div>

<div id="modalMask"><div id="modal">
  <div id="modalMsg"></div>
  <div class="row">
    <button id="modalNo">取消</button>
    <button class="danger" id="modalYes">确定</button>
  </div>
</div></div>
<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
